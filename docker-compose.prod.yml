services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: weather_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-weather_fullstack_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-weather_fullstack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # -------------------------------------------------------------
  # 2. Node.js Express Backend API Service
  # -------------------------------------------------------------
  server:
    image: ghcr.io/${REPO_LOWER:-ankush07261/nodejs-cicd}/weather-server:latest
    container_name: weather_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass_2026}
      DB_NAME: ${DB_NAME:-weather_fullstack_db}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_2026_fullstack}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # -------------------------------------------------------------
  # 3. React Frontend Service (Served via Nginx on Port 80)
  # -------------------------------------------------------------
  client:
    image: ghcr.io/${REPO_LOWER:-ankush07261/nodejs-cicd}/weather-client:latest
    container_name: weather_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app-network

# -------------------------------------------------------------
# Persistent Volumes & Custom Network
# -------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
