services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: weather_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-weather_fullstack_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-weather_fullstack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # -------------------------------------------------------------
  # 2. Node.js Express MVC Backend API Service
  # -------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: weather_server
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-weather_fullstack_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_2026_fullstack}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # -------------------------------------------------------------
  # 3. React (Vite) Frontend UI Service (Served via Nginx)
  # -------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_WEATHER_API_KEY: ${VITE_WEATHER_API_KEY}
    container_name: weather_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - app-network

# -------------------------------------------------------------
# Persistent Volumes & Custom Network
# -------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
