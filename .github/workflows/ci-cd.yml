name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend Checks & Syntax Validation
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (Node.js 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./server

      - name: Verify Backend JavaScript Syntax
        run: |
          node --check src/server.js
          node --check src/app.js
          node --check src/config/db.js
          node --check src/config/initSchema.js
        working-directory: ./server

  # -------------------------------------------------------------
  # Job 2: Frontend Compilation & Build
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (React / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./client

      - name: Build Vite Production Bundle
        run: npm run build
        working-directory: ./client
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_WEATHER_API_KEY: 29d395129097a089a2a83bc2acf3cdcb

  # -------------------------------------------------------------
  # Job 3: Docker Build & Compose Verification
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Images Build & Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: weather-server:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: weather-client:test
          build-args: |
            VITE_API_URL=http://localhost:5000/api
            VITE_WEATHER_API_KEY=29d395129097a089a2a83bc2acf3cdcb

  # -------------------------------------------------------------
  # Job 4: Publish Docker Images (Runs only on Push to Main)
  # -------------------------------------------------------------
  publish-images:
    name: Publish Images to GitHub Container Registry (GHCR)
    runs-on: ubuntu-latest
    needs: [docker-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/weather-server:latest
            ghcr.io/${{ github.repository }}/weather-server:${{ github.sha }}

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/weather-client:latest
            ghcr.io/${{ github.repository }}/weather-client:${{ github.sha }}
          build-args: |
            VITE_API_URL=http://localhost:5000/api
            VITE_WEATHER_API_KEY=29d395129097a089a2a83bc2acf3cdcb
